# Turn the mouse on
set -g mouse on

# Set vi mode
set-window-option -g mode-keys vi

# Set status line
set -g status-style bg=default
set -g status-right "#{?client_prefix,#[reverse]<PREFIX>#[noreverse],}"
set -g window-status-current-style "underscore"

# Switch and resize panes using vi motions
# bind -r h select-pane -L
# bind -r j select-pane -D
# bind -r k select-pane -U
# bind -r l select-pane -R
# bind -r H resize-pane -L 1
# bind -r J resize-pane -D 1
# bind -r K resize-pane -U 1
# bind -r L resize-pane -R 1

# Change selection bindings in vi mode
unbind-key -T copy-mode-vi v
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'C-v' send -X rectangle-toggle
bind-key -T copy-mode-vi 'y' send -X copy-selection

# Set new panes to open in current directory
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Kill current session with prefix Shift + q
bind Q kill-session

# Prevent exiting vi mode on mouse selection
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-no-clear
